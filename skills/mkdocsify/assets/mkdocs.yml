# Generated by the mkdocsify skill.
#   static/    : logo.svg + style.css
#   requirements.txt : pinned Python dependencies
#   .venv/     : virtual environment (mkdocs serve / build from here)
site_name: {{site_name}}
site_description: {{site_description}}
site_url: {{site_url}}
copyright: >
  Copyright &copy; 2016 - 2026 leeyorke
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: false

# 不显示"编辑此页"按钮
edit_uri: null

# shadcn
theme:
  name: shadcn
  show_title: true # show the title in the top bar
  show_stargazers: true # show the stargazers in the top bar
  hide_source_files: false # excludes markdown source files in output site and remove copy page button
  pygments_style: # default styles
    light: shadcn-light
    dark: github-dark
    icon: ./static/logo.svg
  topbar_sections: false
  katex_options: # optional
    macros: # example of macros
      "\\RR": "\\mathbb{R}"
      "\\dx": "\\mathrm{d}x"
  show_datetime: false
  accent: "oklch(64.5% 0.246 16.439)" # NEW!

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - tables
  - fenced_code
  - codehilite
  - shadcn.extensions.iconify

plugins:
  - search
  - macros

extra_css:
  - static/style.css
